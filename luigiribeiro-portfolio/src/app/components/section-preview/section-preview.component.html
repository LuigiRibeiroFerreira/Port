<div class="section-preview">
    <div class="icon-wrapper" *ngIf="section.icon" [innerHTML]="icons[section.icon]"></div>
    <div class="text-content">
      <h2>{{ section.title }}</h2>
      <p>{{ section.text }}</p>
      <a [routerLink]="section.button.path" class="btn btn-primary">{{ section.button.label }}</a>
    </div>
</div>
