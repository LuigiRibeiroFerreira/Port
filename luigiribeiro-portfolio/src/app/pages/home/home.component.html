<div class="home">
    <app-hero [heroData]="(homeData$ | async)?.hero"></app-hero>
    <div class="sections-container">
      
      <ng-container *ngFor="let section of (homeData$ | async)?.sections">
        <app-section-preview [section]="section"></app-section-preview>
      </ng-container>
    </div>
</div>
